[package]
name = "compass-minecraft"
version = "0.1.0"
edition = "2021"
authors = ["NEXORA Studios <jim.lin@nexora-studios.tech>"]
license = "Apache-2.0"
description = "Minecraft core library for Compass Launcher"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
semver = "1.0"
sysinfo = "0.30"
zip = "0.6"

[features]
default = ["forge", "fabric", "quilt"]
forge = []
fabric = []
quilt = []
