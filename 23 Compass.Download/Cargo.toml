[package]
name = "compass-download"
version = "0.1.0"
edition = "2021"
authors = ["NEXORA Studios <jim.lin@nexora-studios.tech>"]
license = "Apache-2.0"
description = "Download manager for Compass Launcher"

[dependencies]
compass-core = { path = "../21 Compass.Core" }

reqwest = { version = "0.11", features = ["json", "stream"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
futures = "0.3"
bytes = "1.5"
pin-project = "1.1"
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3.8"
