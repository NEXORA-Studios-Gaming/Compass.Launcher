[package]
name = "compass-auth"
version = "0.1.0"
edition = "2021"
authors = ["NEXORA Studios <jim.lin@nexora-studios.tech>"]
license = "Apache-2.0"
description = "Authentication module for Compass Launcher"

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
oauth2 = { version = "4.4", optional = true }
jsonwebtoken = "9.2"
keyring = "2.0"
uuid = { version = "1.6", features = ["v4", "serde"] }

[features]
default = ["microsoft", "offline"]
microsoft = ["oauth2"]
offline = []
