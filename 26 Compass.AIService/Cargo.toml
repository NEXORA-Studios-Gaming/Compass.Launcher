[package]
name = "compass-ai-service"
version = "0.1.0"
edition = "2021"
authors = ["NEXORA Studios <jim.lin@nexora-studios.tech>"]
license = "Apache-2.0"
description = "AI service for Compass Launcher"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
interprocess = "1.2"
axum = "0.7"
tower = "0.4"

[features]
default = ["cloud-api"]
local-model = []
cloud-api = []
