syntax = "proto3";

package compass.download;

option csharp_namespace = "Compass.Proto.Download";

import "compass/common.proto";

// 下载任务状态
enum DownloadStatus {
    PENDING = 0;
    DOWNLOADING = 1;
    PAUSED = 2;
    COMPLETED = 3;
    FAILED = 4;
    CANCELLED = 5;
}

// 下载任务
message DownloadTask {
    string id = 1;
    string url = 2;
    string target_path = 3;
    string filename = 4;
    int64 total_size = 5;
    int64 downloaded_size = 6;
    DownloadStatus status = 7;
    string error_message = 8;
    int32 retry_count = 9;
    string checksum = 10;  // SHA1
}

// 创建下载任务请求
message CreateDownloadRequest {
    string url = 1;
    string target_path = 2;
    string checksum = 3;  // 可选
}

// 创建下载任务响应
message CreateDownloadResponse {
    bool success = 1;
    string task_id = 2;
    string error_message = 3;
}

// 批量下载请求
message BatchDownloadRequest {
    repeated CreateDownloadRequest tasks = 1;
}

// 批量下载响应
message BatchDownloadResponse {
    bool success = 1;
    repeated string task_ids = 2;
    string error_message = 3;
}

// 获取下载任务请求
message GetDownloadTaskRequest {
    string task_id = 1;
}

// 获取下载任务响应
message GetDownloadTaskResponse {
    DownloadTask task = 1;
}

// 获取下载列表请求
message GetDownloadListRequest {
    DownloadStatus filter = 1;  // 空表示全部
}

// 获取下载列表响应
message GetDownloadListResponse {
    repeated DownloadTask tasks = 1;
}

// 暂停下载请求
message PauseDownloadRequest {
    string task_id = 1;
}

// 恢复下载请求
message ResumeDownloadRequest {
    string task_id = 1;
}

// 取消下载请求
message CancelDownloadRequest {
    string task_id = 1;
}

// 下载进度流（用于实时更新）
message DownloadProgress {
    string task_id = 1;
    int64 downloaded = 2;
    int64 total = 3;
    int64 speed = 4;  // bytes per second
    DownloadStatus status = 5;
    float percentage = 6;
}

// 订阅下载进度请求
message SubscribeDownloadProgressRequest {}

// 镜像源信息
message MirrorSource {
    string name = 1;
    string base_url = 2;
    bool is_default = 3;
    int32 priority = 4;
}

// 获取镜像源列表请求
message GetMirrorSourcesRequest {}

// 获取镜像源列表响应
message GetMirrorSourcesResponse {
    repeated MirrorSource sources = 1;
}

// 设置默认镜像源请求
message SetDefaultMirrorRequest {
    string name = 1;
}
