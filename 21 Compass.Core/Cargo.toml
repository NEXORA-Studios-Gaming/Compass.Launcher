[package]
name = "compass-core"
version = "0.1.0"
edition = "2021"
authors = ["NEXORA Studios <jim.lin@nexora-studios.tech>"]
license = "Apache-2.0"
description = "Core utilities and types for Compass Launcher"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"
dirs = "5.0"
